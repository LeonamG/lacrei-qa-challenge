name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rodar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/**/*.feature
          install-command: npm install --legacy-peer-deps --force
        env:
          CYPRESS_userEmail: ${{ secrets.CYPRESS_USER_EMAIL }}
          CYPRESS_userPassword: ${{ secrets.CYPRESS_USER_PASSWORD }}

      - name: Salvar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-results
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
